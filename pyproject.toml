[project]
name = "messenger-mcp"
version = "0.1.0"
description = "Facebook Messenger as an MCP server for Claude Code, Codex and other MCP clients"
readme = "README.md"
authors = [
    { name = "fukata", email = "tatsuya.fukata@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fbchat-v2==2.3.2",
    "mcp>=1.12",
]

[project.scripts]
messenger-mcp = "messenger_mcp:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
